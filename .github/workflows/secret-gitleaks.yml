name: Gitleaks

# Gitleaks: rule-based secret scanner over the full git history.
# Reviewed false positives are listed in .gitleaksignore. Uploads SARIF to
# code scanning.
#
# One of six overlapping secret scanners, each in its own workflow so the
# README shows a status badge per tool: secret-gitleaks.yml,
# secret-trufflehog.yml, secret-kingfisher.yml, secret-2ms.yml,
# secret-detect-secrets.yml and secret-gitguardian.yml. Any finding fails
# the job.
#
# The tool binary is fetched from the project's GitHub release at a fixed
# version and checked against the SHA-256 recorded below, so a replaced
# release asset fails the job instead of running. To upgrade, bump the
# version and hash together.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2'   # Tuesdays: picks up new detector rules against old history
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-gitleaks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --report-format sarif --report-path gitleaks.sarif .

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
