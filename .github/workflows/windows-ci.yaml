name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  release:
    types: [published]

# Default-deny; each job grants itself only what it needs.
permissions: {}

jobs:
  build:
    # Pinned to windows-2022, NOT windows-latest: every windows-2025* label
    # now serves the vs2026 image, whose VS 18 carries Spectre-mitigated libs
    # only for its own v145 toolset. This project pins PlatformToolset v143
    # and builds with /Qspectre (Directory.Build.props), which needs the v143
    # (14.4x) Spectre libs — present only in windows-2022's VS 2022. Revisit
    # when the projects move toolsets or windows-2022 retires.
    runs-on: windows-2022
    # Least privilege: the build needs only read access, plus
    # security-events: write so the BinSkim step can upload its SARIF to
    # code scanning. Publishing to a GitHub Release (which needs
    # contents: write) is done by the separate release job below, on
    # release events only.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false  # build only; no git push needs the token

      # Cache the bundled minidrivers so we don't re-hit vendor sites every run.
      # The key tracks Installer/Stage-Minidrivers.ps1, which carries the URL +
      # SHA-256 manifest for each driver; changing either rotates the cache.
      - name: Cache bundled minidrivers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: Installer/drivers
          key: drivers-${{ hashFiles('Installer/Stage-Minidrivers.ps1') }}

      # Pinned so a new NSIS release cannot change the installer without a
      # reviewed commit. 3.13.0 is the current approved Chocolatey package
      # (published 2026-09-27), i.e. what unpinned runs have been getting; the
      # package itself verifies the checksum of the NSIS setup it downloads.
      - name: Install NSIS
        run: choco install nsis --version 3.13.0 -y --no-progress

      - name: Stage LICENSE for NSIS
        shell: pwsh
        run: Copy-Item LICENSE Installer\License.txt -Force

      # build.ps1 generates an SPDX SBOM under Installer\sbom when this tool
      # is on PATH, and silently skips it otherwise.
      # Pinned to the current stable release; bump deliberately.
      - name: Install sbom-tool
        shell: pwsh
        run: dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.13

      - name: Build (Release x64)
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Platform x64

      # BinSkim verifies the compiled binaries opted into the exploit
      # mitigations (/GS, ASLR, DEP, CFG, SafeSEH, Spectre...). It ships as a
      # plain NuGet package, not a dotnet tool, so fetch and unzip the nupkg.
      # The nupkg is checked against a pinned SHA-256 before it is unpacked
      # (cross-checked against the SHA-512 nuget.org publishes for 4.4.9.11);
      # bump both together.
      # The step fails only if no SARIF was produced (tool breakage); rule
      # findings surface as code scanning alerts, not CI failures. The NSIS
      # installer stub is excluded: its PE is produced by NSIS, so findings
      # there would not be actionable in this repo.
      - name: BinSkim binary scan
        shell: pwsh
        env:
          BINSKIM_VERSION: '4.4.9.11'
          BINSKIM_SHA256: 69678989cbc273b5b50fcf98fb0fd978e1e35a3f844acb24254b31f0ce90c447
        run: |
          $ver = $env:BINSKIM_VERSION
          $sha256 = $env:BINSKIM_SHA256
          $nupkg = Join-Path $env:RUNNER_TEMP 'binskim.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/$ver/microsoft.codeanalysis.binskim.$ver.nupkg" -OutFile $nupkg
          $actual = (Get-FileHash -LiteralPath $nupkg -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            Write-Error "BinSkim $ver nupkg SHA-256 mismatch: expected $sha256, got $actual"
            exit 1
          }
          Expand-Archive $nupkg (Join-Path $env:RUNNER_TEMP 'binskim') -Force
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'binskim') -Recurse -Filter binskim.exe |
            Where-Object FullName -match 'win-x64' | Select-Object -First 1
          & $exe.FullName analyze 'x64\Release\*.exe' 'x64\Release\*.dll' --output binskim.sarif
          if (-not (Test-Path binskim.sarif)) { exit 1 }

          # Code scanning rejects SARIF whose results carry message.id +
          # arguments instead of inline text ("expected a result message").
          # BinSkim has no flag to flatten them, so expand each result's
          # message from its rule's messageStrings template here.
          $sarif = Get-Content binskim.sarif -Raw | ConvertFrom-Json
          foreach ($run in $sarif.runs) {
            $rules = $run.tool.driver.rules
            foreach ($result in $run.results) {
              if ($result.message.PSObject.Properties['text']) { continue }
              $rule = if ($result.PSObject.Properties['ruleIndex']) { $rules[$result.ruleIndex] }
                      else { $rules | Where-Object id -eq $result.ruleId | Select-Object -First 1 }
              $template = $rule.messageStrings.($result.message.id).text
              $arguments = @($result.message.arguments)
              $text = [regex]::Replace($template, '\{(\d+)\}',
                { param($m) $arguments[[int]$m.Groups[1].Value] })
              $result.message = [pscustomobject]@{ text = $text }
            }
          }
          $sarif | ConvertTo-Json -Depth 100 | Set-Content binskim.sarif -Encoding utf8
          exit 0

      - name: Upload BinSkim SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          sarif_file: binskim.sarif
          category: binskim

      - name: Package release zip
        shell: pwsh
        run: |
          $zip = New-Item -ItemType Directory -Path Installer\Zip -Force
          Copy-Item Installer\EIDInstallx64.exe $zip -Force
          Copy-Item Installer\License.txt      $zip -Force
          if (Test-Path Installer\SHA256SUMS.txt) {
            Copy-Item Installer\SHA256SUMS.txt $zip -Force
          }
          Compress-Archive -Path "$($zip.FullName)\*" `
            -DestinationPath Installer\OpenAccessEID-x64.zip -Force
          if (Test-Path Installer\sbom) {
            Compress-Archive -Path Installer\sbom\* `
              -DestinationPath Installer\OpenAccessEID-x64.sbom.zip -Force
          }

      # Always store the build outputs as workflow artifacts. On CI/PR runs these
      # are the deliverable; on release runs the release job below downloads them
      # to attach to the GitHub Release (keeps write scope out of this job).
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: OpenAccessEID-${{ github.sha }}
          path: |
            Installer/EIDInstallx64.exe
            Installer/OpenAccessEID-x64.zip
            Installer/OpenAccessEID-x64.sbom.zip
            Installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14

  # Release runs only: attach the built artifacts to the GitHub Release that
  # triggered us. Isolated here so contents: write is scoped to release events.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Required to upload assets to the GitHub Release
      id-token: write     # Required to sign the build provenance attestation
      attestations: write # Required to store the attestation
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: OpenAccessEID-${{ github.sha }}
          path: dist

      # Cryptographically binds each release asset to this workflow run and
      # commit (SLSA provenance). Air-gapped operators can verify an installer
      # before carrying it across: gh attestation verify EIDInstallx64.exe
      #   --repo SP00KY-CB/OpenAccessEID
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        with:
          subject-path: |
            dist/EIDInstallx64.exe
            dist/OpenAccessEID-x64.zip
            dist/OpenAccessEID-x64.sbom.zip
            dist/SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: |
            dist/EIDInstallx64.exe
            dist/OpenAccessEID-x64.zip
            dist/OpenAccessEID-x64.sbom.zip
            dist/SHA256SUMS.txt
