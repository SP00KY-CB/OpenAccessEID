name: Kusari Inspector

# Kusari Inspector's CI scan: reviews each pull request's changes against
# main for dependency, supply chain and code risks, and fails the PR when
# Kusari's verdict is not to proceed. The Kusari GitHub App already posts a
# review comment on every PR, so this workflow does not post a second one;
# the verdict is in the job log and the SARIF result is kept as an artifact.
#
# This runs the Kusari CLI release directly on the runner (version and
# SHA-256 pinned below) rather than Kusari's reusable workflow, whose CLI
# container lacks the libstdc++ that actions/checkout needs, so that
# workflow fails before it scans.
#
# Secrets: KUSARI_CLIENT_ID and KUSARI_CLIENT_KEY (the client secret), from
# the Kusari console.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: kusari-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  kusari:
    name: Kusari Inspector scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dependabot runs do not receive Actions secrets.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    env:
      KUSARI_VERSION: 2.13.0
      KUSARI_SHA256: bdf71716eeec971129bd357a9d82988ec1a28136e88f298cc919077fd4404807
    steps:
      - name: Check that the Kusari credentials are configured
        env:
          KUSARI_CLIENT_ID: ${{ secrets.KUSARI_CLIENT_ID }}
          KUSARI_CLIENT_SECRET: ${{ secrets.KUSARI_CLIENT_KEY }}
        run: |
          if [ -z "$KUSARI_CLIENT_ID" ] || [ -z "$KUSARI_CLIENT_SECRET" ]; then
            echo "::error::Repository secrets KUSARI_CLIENT_ID and KUSARI_CLIENT_KEY must both be set (Kusari console)."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # the scan diffs the PR against origin/<base>
          persist-credentials: false

      - name: Install the Kusari CLI
        run: |
          asset="kusari-cli_${KUSARI_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$asset" "https://github.com/kusaridev/kusari-cli/releases/download/v${KUSARI_VERSION}/$asset"
          echo "$KUSARI_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" kusari
          "$RUNNER_TEMP/kusari" --help > /dev/null

      - name: Authenticate with Kusari
        env:
          KUSARI_CLIENT_ID: ${{ secrets.KUSARI_CLIENT_ID }}
          KUSARI_CLIENT_SECRET: ${{ secrets.KUSARI_CLIENT_KEY }}
        run: |
          "$RUNNER_TEMP/kusari" auth login --client-id "$KUSARI_CLIENT_ID" --client-secret "$KUSARI_CLIENT_SECRET"

      - name: Scan the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # CI checks out a detached merge commit, so report the PR's branch.
          "$RUNNER_TEMP/kusari" repo scan --wait --output-format sarif \
            --override-branch "$HEAD_REF" . "origin/$BASE_REF" > kusari_results.sarif

      - name: Show the verdict
        continue-on-error: true
        run: |
          summary=$(jq -r '.runs[0].results[0].message.markdown' kusari_results.sarif)
          if [ -z "$summary" ] || [ "$summary" = "null" ]; then summary="No results found"; fi
          printf '%s\n' "$summary"
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

      # should_proceed is Kusari's go/no-go; a missing result fails closed.
      - name: Fail on a no-go verdict
        run: |
          if [ ! -s kusari_results.sarif ]; then
            echo "::error::Kusari returned no SARIF results."
            exit 1
          fi
          if jq -e '[.runs[]?.results[]?.properties.should_proceed] | any(. == false or . == "false")' kusari_results.sarif > /dev/null; then
            echo "::error::Kusari Inspector recommends not proceeding with this change; see the verdict above."
            exit 1
          fi
          echo "Kusari Inspector: no blocking issues."

      - name: Upload SARIF
        if: always() && hashFiles('kusari_results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: kusari-sarif-results
          path: kusari_results.sarif
          retention-days: 30
