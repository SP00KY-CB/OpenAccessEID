name: 2MS

# 2MS (Checkmarx "Too Many Secrets"): secret scanner over the full git
# history. Reviewed false positives are listed in TWOMS_IGNORE. Uploads SARIF
# to code scanning.
#
# One of six overlapping secret scanners, each in its own workflow so the
# README shows a status badge per tool: secret-gitleaks.yml,
# secret-trufflehog.yml, secret-kingfisher.yml, secret-2ms.yml,
# secret-detect-secrets.yml and secret-gitguardian.yml. Any finding fails
# the job.
#
# The tool binary is fetched from the project's GitHub release at a fixed
# version and checked against the SHA-256 recorded below, so a replaced
# release asset fails the job instead of running. To upgrade, bump the
# version and hash together.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 5 * * 2'   # Tuesdays: picks up new detector rules against old history
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-2ms-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  two-ms:
    name: 2MS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      TWOMS_VERSION: 5.4.0
      TWOMS_SHA256: 5c8a94a53cd6f811b85e19f7d2ceae555355813e954b6ae5697d579ba92319dc
      # Reviewed false positives (result ids): the same two deleted
      # placeholder examples .gitleaksignore lists, seen in two commits each.
      TWOMS_IGNORE: >-
        0975e526ea411ed14d1ddfd4edcc90342a51b32e,8837d2846561a1b35b1b95f8bab93e5dac2a597f,8bdce1099a4244db56e4d6e8ebe0194a5ce351c4,8e70608916c3156937d6ca8f977c85d0b7db9c6e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install 2MS
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/2ms.zip" "https://github.com/checkmarx/2ms/releases/download/v${TWOMS_VERSION}/linux-amd64.zip"
          echo "$TWOMS_SHA256  $RUNNER_TEMP/2ms.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/2ms.zip" 2ms -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/2ms"

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/2ms" git . --log-level warn \
            --ignore-result "$TWOMS_IGNORE" --report-path 2ms.sarif

      - name: Upload SARIF
        if: always() && hashFiles('2ms.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          sarif_file: 2ms.sarif
          category: 2ms
