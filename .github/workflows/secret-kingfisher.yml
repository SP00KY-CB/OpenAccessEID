name: Kingfisher

# Kingfisher (MongoDB): 485+ secret rules over the full git history, with
# live validation of findings. Uploads SARIF to code scanning.
#
# One of six overlapping secret scanners, each in its own workflow so the
# README shows a status badge per tool: secret-gitleaks.yml,
# secret-trufflehog.yml, secret-kingfisher.yml, secret-2ms.yml,
# secret-detect-secrets.yml and secret-gitguardian.yml. Any finding fails
# the job.
#
# The tool binary is fetched from the project's GitHub release at a fixed
# version and checked against the SHA-256 recorded below, so a replaced
# release asset fails the job instead of running. To upgrade, bump the
# version and hash together.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 5 * * 2'   # Tuesdays: picks up new detector rules against old history
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-kingfisher-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  kingfisher:
    name: Kingfisher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      KINGFISHER_VERSION: 2.8.0
      KINGFISHER_SHA256: dfc59a8962c3b7c1365e35ba161012a7b0e2f06be95f225a5153ae2abd71cf39
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Kingfisher
        run: |
          asset=kingfisher-linux-x64.tgz
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$asset" "https://github.com/mongodb/kingfisher/releases/download/v${KINGFISHER_VERSION}/$asset"
          echo "$KINGFISHER_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" kingfisher

      # Exit code 200 = findings, 205 = findings validated as live.
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/kingfisher" scan . --no-update-check --redact \
            --format sarif --output kingfisher.sarif

      - name: Upload SARIF
        if: always() && hashFiles('kingfisher.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          sarif_file: kingfisher.sarif
          category: kingfisher
